name: Test Meteo Script

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Ti permette di avviare il test manualmente dall'interfaccia di GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: meteo
        environment-file: environment.yml
        auto-activate-base: false

    - name: Run Script
      shell: bash -el {0}
      run: |
        python prev_grandine.py

    - name: Upload Generated Output Image
      uses: actions/upload-artifact@v4
      with:
        name: mappa-riassunto-24h
        path: mappa_riassunto_24h.png
        if-no-files-found: warn
