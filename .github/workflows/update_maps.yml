name: Generate Weather Maps Daily

on:
  schedule:
    # Esegue lo script ogni giorno alle 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permette l'avvio manuale

# Concede i permessi di scrittura necessari per il git push
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sostituiamo setup-python + apt install con setup-miniconda
      - name: Set up Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: meteo # SOSTITUISCI 'meteo' con il nome esatto del tuo ambiente (è la prima riga dentro environment.yml, es: name: XXX)
          auto-activate-base: false
          use-mamba: true # Usa mamba per velocizzare il download delle librerie

      # Eseguiamo lo script dentro l'ambiente Conda attivato
      - name: Run map generation script
        shell: bash -l {0} # FONDAMENTALE: forza l'uso dell'ambiente Conda caricato
        run: python generate_maps.py

      - name: Commit and push updated maps
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.png
          git commit -m "Auto-update maps" || exit 0
          git push
