name: Generate Weather Maps Daily

on:
  schedule:
    # Esegue lo script ogni giorno alle 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permette l'avvio manuale

# Concede i permessi di scrittura necessari per il git push
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-bin libeccodes-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas xarray matplotlib cartopy herbie-data eccodes cfgrib

      - name: Run map generation script
        run: python generate_maps.py

      - name: Commit and push updated maps
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.png
          git commit -m "Auto-update maps" || exit 0
          git push
